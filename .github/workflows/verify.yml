name: Verify Greenwood
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Reads the pnpm version from the packageManager pin in package.json (pnpm 10).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build core (web and MCP consume its types)
        run: pnpm --filter @greenwood/core build
      - run: pnpm typecheck
      - run: pnpm check:links
      - name: Tests (core, MCP, API endpoints and OpenAPI contract; network stubbed)
        run: pnpm test
      - run: pnpm test:ui
      - name: OpenAPI document matches docs/openapi.json
        run: pnpm openapi:check
      - run: pnpm build
      - run: |
          pnpm start > /tmp/greenwood-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          pnpm smoke
